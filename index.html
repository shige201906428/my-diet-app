<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>減量管理ダッシュボード</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background-color: #f8f9fa; font-family: sans-serif; }
        .card { border-radius: 12px; border: none; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    </style>
</head>
<body>
<div class="container py-4" style="max-width: 600px;">
    <div class="text-center mb-4">
        <h2 class="fw-bold">🏃‍♂️ 減量管理ダッシュボード</h2>
        <p class="text-muted">2ヶ月で2kg減目標</p>
    </div>

    <div class="card p-3 bg-light">
        <label class="form-label fw-bold">🔑 Gemini APIキー設定</label>
        <div class="input-group">
            <input type="password" id="apiKey" class="form-control" placeholder="AIzaSy...">
            <button class="btn btn-secondary" type="button" onclick="saveApiKey()">保存</button>
        </div>
    </div>

    <ul class="nav nav-tabs justify-content-center my-3" id="myTab" role="tablist">
        <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#t1" type="button">📸 カロリー計算</button></li>
        <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#t2" type="button">📝 体重記録</button></li>
    </ul>

    <div class="tab-content">
        <div class="tab-pane fade show active" id="t1" role="tabpanel">
            <div class="card p-4">
                <input type="file" id="imageInput" class="form-control mb-3" accept="image/*">
                <button class="btn btn-primary w-100 fw-bold" type="button" onclick="analyzeImage()">AIでカロリー判定</button>
                <div id="loading" class="text-center my-3 d-none">🧙‍♂️ AI解析中...</div>
                <div id="aiResult" class="mt-3 p-3 bg-white border rounded d-none" style="white-space: pre-wrap;"></div>
            </div>
        </div>

        <div class="tab-pane fade" id="t2" role="tabpanel">
            <div class="card p-4">
                <div class="row g-2 mb-3">
                    <div class="col-6"><label class="form-label">日付</label><input type="date" id="logDate" class="form-control"></div>
                    <div class="col-6"><label class="form-label">体重 (kg)</label><input type="number" id="logWeight" class="form-control" step="0.1" value="65.0"></div>
                    <div class="col-6"><label class="form-label">カロリー (kcal)</label><input type="number" id="logCalorie" class="form-control" step="50" value="1500"></div>
                    <div class="col-6"><label class="form-label">メモ</label><input type="text" id="logMemo" class="form-control" placeholder="ゆで卵など"></div>
                </div>
                <button class="btn btn-success w-100 fw-bold" type="button" onclick="saveData()">データを記録</button>
            </div>
            <div class="card p-4">
                <canvas id="weightChart" class="mb-3"></canvas>
                <canvas id="calorieChart"></canvas>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    let healthData = JSON.parse(localStorage.getItem('health_data')) || {};
    let weightChart = null, calorieChart = null;

    window.onload = function() {
        document.getElementById('logDate').valueAsDate = new Date();
        document.getElementById('apiKey').value = localStorage.getItem('gemini_api_key') || '';
        updateCharts();
    };

    function saveApiKey() {
        localStorage.setItem('gemini_api_key', document.getElementById('apiKey').value.trim());
        alert('APIキーを保存しました！');
    }

    function saveData() {
        const date = document.getElementById('logDate').value;
        if(!date) return alert('日付を選択してください');
        healthData[date] = {
            weight: parseFloat(document.getElementById('logWeight').value),
            calories: parseInt(document.getElementById('logCalorie').value),
            memo: document.getElementById('logMemo').value
        };
        localStorage.setItem('health_data', JSON.stringify(healthData));
        alert('データを保存しました！');
        updateCharts();
    }

    function updateCharts() {
        const dates = Object.keys(healthData).sort();
        const weights = dates.map(d => healthData[d].weight);
        const calories = dates.map(d => healthData[d].calories);

        if(weightChart) weightChart.destroy();
        if(calorieChart) calorieChart.destroy();

        if(document.getElementById('weightChart')) {
            weightChart = new Chart(document.getElementById('weightChart'), {
                type: 'line', data: { labels: dates, datasets: [{ label: '体重 (kg)', data: weights, borderColor: '#0d6efd' }] }
            });
        }
        if(document.getElementById('calorieChart')) {
            calorieChart = new Chart(document.getElementById('calorieChart'), {
                type: 'bar', data: { labels: dates, datasets: [{ label: 'カロリー (kcal)', data: calories, backgroundColor: '#198754' }] }
            });
        }
    }

    async function analyzeImage() {
        const key = localStorage.getItem('gemini_api_key');
        if(!key) return alert('先にAPIキーを保存してください。');
        const fileInput = document.getElementById('imageInput');
        if(fileInput.files.length === 0) return alert('写真を選択してください。');

        document.getElementById('loading').classList.remove('d-none');
        document.getElementById('aiResult').classList.add('d-none');

        const reader = new FileReader();
        reader.onloadend = async () => {
            try {
                const base64Data = reader.result.split(',')[1];
                const payload = {
                    contents: [{ parts: [{ text: "優秀な管理栄養士として食事画像から料理名、分量、カロリー、栄養素を識別し出力してください。2ヶ月で2kg減のダイエット中（1日1400-1500kcal、揚げ物NG）なのでヘルシーにするアドバイスも1言添えて。" }, { inlineData: { mimeType: fileInput.files[0].type, data: base64Data } }] }]
                };
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)
                });
                const result = await res.json();
                if(result?.candidates?.[0]?.content?.parts?.[0]?.text) {
                    document.getElementById('aiResult').innerText = result.candidates[0].content.parts[0].text;
                    document.getElementById('aiResult').classList.remove('d-none');
                } else {
                    alert('お使いのAPIキーは期限切れ、または無効です。新しいキーを発行して保存し直してください。');
                }
            } catch (e) {
                alert('通信エラーが発生しました。');
                console.error(e);
            } finally {
                document.getElementById('loading').classList.add('d-none');
            }
        };
        reader.readAsDataURL(fileInput.files[0]);
    }
</script>
</body>
</html>
